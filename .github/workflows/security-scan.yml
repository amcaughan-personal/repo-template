name: security

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: amcaughan-personal/shared_workflows/.github/workflows/security-scan.yml@2a217b1678e3b0394a365e593ca570a4b63c4e33
    permissions:
      contents: read
      pull-requests: write # to comment when there are findings
    with:
      # Add checkov if this repo gets infrastructure code (Terraform, Dockerfiles).
      scans: '["trivy", "gitleaks", "actionlint"]'
