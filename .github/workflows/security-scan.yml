name: security

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: amcaughan-personal/shared-workflows/.github/workflows/security-scan.yml@b8d6eec5549f1cf8c41c594531f3febd7d059c8a # v2.4.0
    permissions:
      contents: read
      pull-requests: write # to comment when there are findings
    with:
      scans: "checkov, trivy, gitleaks, actionlint"
