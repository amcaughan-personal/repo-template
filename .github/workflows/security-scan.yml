name: security

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: amcaughan-personal/shared-workflows/.github/workflows/security-scan.yml@f0f0d6e584ed0188191247c0e608893c9b12fe04 # v2.3.1
    permissions:
      contents: read
      pull-requests: write # to comment when there are findings
    with:
      scans: "checkov, trivy, gitleaks, actionlint"
