name: security

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: amcaughan-personal/shared_workflows/.github/workflows/security-scan.yml@2c8122a6fe3285aa21ed048aff5d713a69fd8539
    permissions:
      contents: read
      pull-requests: write # to comment when there are findings
    with:
      # Add checkov if this repo gets infrastructure code (Terraform, Dockerfiles).
      scans: "trivy, gitleaks, actionlint"
