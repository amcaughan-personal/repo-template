name: security

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: amcaughan-personal/shared_workflows/.github/workflows/security-scan.yml@7b2861db13ccd0a42d1c41f5f5d68bbf163fc431
    permissions:
      contents: read
      pull-requests: write # to comment when there are findings
    with:
      # Turn on if this repo gets infrastructure code (Terraform, Dockerfiles).
      checkov: false
