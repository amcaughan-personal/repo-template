name: security

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: amcaughan-personal/shared_workflows/.github/workflows/security-scan.yml@a7fc2d23a79e4c7a8b3ff770254de11730a99413
    permissions:
      contents: read
      pull-requests: write # to comment when there are findings
    with:
      # Turn on if this repo gets infrastructure code (Terraform, Dockerfiles).
      checkov: false
