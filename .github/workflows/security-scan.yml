name: security

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: amcaughan-personal/shared_workflows/.github/workflows/security-scan.yml@7682ae477016c2253037d65441bf8efcf0a60994
    permissions:
      contents: read
      pull-requests: write # to comment when there are findings
    with:
      # Add checkov if this repo gets infrastructure code (Terraform, Dockerfiles).
      scans: "trivy, gitleaks, actionlint"
